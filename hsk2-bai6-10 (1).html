h+=`<div class="rc" data-p="${pi}"><h3>Bài đọc ${pi+1}${P.T?" ★ (bài đọc có nội dung liền mạch)":" (nhóm câu)"}<small>${ok}/${Q.length} đúng</small></h3><div class="rz">${P.S.map(s=>s[0]).join("")}</div><div class="py opt">${P.S.map(s=>py(s[0])).join(" ")}</div><button class="sm trb">Dịch</button><button class="sm rdo">Làm lại</button><div class="trn${openTr.has(key)?" on":""}">${P.S.map(s=>s[1]).join(" ")}</div>${qs}</div>`});
rd.innerHTML=h;
rles.querySelectorAll("button").forEach(b=>{const i=+b.dataset.l;let ok=0,t=0;RQ[i].forEach((Q,pi)=>Q.forEach((q,qi)=>{t++;const a=st.r[`${i}.${pi}.${qi}`];if(a!=null&&a===q.c)ok++}));b.textContent=`${PS[i].t} · ${ok}/${t}`;b.classList.toggle("on",i===st.rl)})}
function applyView(){const r=st.v==="r";$("#app").hidden=r;$("#les").hidden=r;$("#tabs").hidden=r;rles.hidden=!r;rd.hidden=!r;
view.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.v===st.v));if(r)renderR()}
view.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;st.v=b.dataset.v;save();applyView();scrollTo(0,0)});
rles.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;st.rl=+b.dataset.l;save();renderR();scrollTo(0,0)});
rd.addEventListener("click",e=>{const t=e.target,c=t.closest(".rc");if(!c)return;const pi=+c.dataset.p,key=`${st.rl}.${pi}`;
if(t.closest(".ob")){const b=t.closest(".ob");if(st.r[b.dataset.k]!=null)return;st.r[b.dataset.k]=+b.dataset.i;save();renderR()}
else if(t.closest(".trb")){openTr.has(key)?openTr.delete(key):openTr.add(key);c.querySelector(".trn").classList.toggle("on")}
else if(t.closest(".rdo")){Object.keys(st.r).filter(k=>k.startsWith(key+".")).forEach(k=>delete st.r[k]);save();renderR()}});
$("#bk").onclick=()=>{const b=new Blob([JSON.stringify(st)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="hsk2-sao-luu-"+new Date().toISOString().slice(0,10)+".json";a.click()};
$("#rs").onclick=()=>$("#rf").click();
$("#rf").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const x=JSON.parse(t);if(typeof x!=="object"||!x||!x.a)throw 0;localStorage.setItem(KEY,JSON.stringify(Object.assign({a:{},bad:{},rv:{},r:{}},x)));location.reload()}catch(err){alert("File sao lưu không hợp lệ")}})};
applyView();
</script>
